name: Build

# Teste puis construit le jeu pour Windows, Linux, Web, macOS et Android (APK debug)
# à chaque tag vX.Y.Z ou à la demande (Actions > Build > Run workflow).
# Les fichiers sont joints au run, et à la Release GitHub pour un tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  test:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Import
        run: godot --headless --path . --import || true
      - name: Test de fumée
        run: godot --headless --path . --script tests/smoke.gd
      - name: Robot joueur
        run: godot --headless --path . --script tests/bot.gd -- 0 1

  export:
    needs: test
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Modèles d'export
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          cp -r /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/ || true
      - name: Export Windows, Linux, Web, macOS
        run: |
          apt-get update -qq && apt-get install -y -qq zip
          chmod +x tools/build_all.sh
          GODOT=godot tools/build_all.sh windows linux web macos
      - name: Export Android (APK debug)
        continue-on-error: true
        run: |
          mkdir -p ~/.config/godot
          keytool -genkeypair -keystore /tmp/debug.keystore -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo '[resource]'
            echo 'export/android/android_sdk_path = "/usr/lib/android-sdk"'
            echo 'export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"'
            echo 'export/android/debug_keystore = "/tmp/debug.keystore"'
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
          } > ~/.config/godot/editor_settings-4.3.tres
          GODOT=godot tools/build_all.sh android
      - uses: actions/upload-artifact@v4
        with:
          name: DiamantRush3D-builds
          path: dist/
      - name: Release GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
